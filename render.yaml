services:
  - type: web
    name: circla-bot
    runtime: docker
    rootDir: bot
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CIRCLA_VAULT_ADDRESS
        value: 0x25Fcc446bBfb7444F0b9738423dD58713361010d
      - key: CIRCLA_TMA_URL
        value: https://circlabasebot.vercel.app/app
      - key: CIRCLA_TMA_DIRECT_LINK
        value: https://t.me/circlabasebot/circlabasebot
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      - key: CIRCLA_WEBHOOK_URL
        sync: false
      - key: CIRCLA_WEBHOOK_SECRET
        sync: false